<div style="margin-bottom: 1rem;">
  <p-button label="Nouvel Article" icon="pi pi-plus" (onClick)="ouvrirDialog()" />
</div>

<p-table [value]="articles()" [paginator]="true" [rows]="5">

  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Nom</th>
      <th>Description</th>
      <th>Prix Unitaire</th>
      <th>Type Événement</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-article>
    <tr>
      <td>{{ article.idArticle }}</td>
      <td>{{ article.nom }}</td>
      <td>{{ article.description }}</td>
      <td>{{ article.prixUnitaire | currency:'XAF':'symbol':'1.0-0' }}</td>
      <td>
        <p-tag [value]="article.typeEvenement" [severity]="getCouleurType(article.typeEvenement)" />
      </td>
      <td style="display: flex; gap: 0.5rem;">
        <p-button icon="pi pi-pencil" severity="info" (onClick)="modifierArticle(article)" />
        <p-button icon="pi pi-trash" severity="danger" (onClick)="supprimerArticle(article.idArticle)" />
      </td>
    </tr>
  </ng-template>

</p-table>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  header="Article"
  [modal]="true"
  [style]="{ width: '450px' }">

  <div style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0;">

    <input
      pInputText
      placeholder="Nom de l'article"
      [value]="articleSelectionne().nom"
      (input)="mettreAJourChamp('nom', $any($event.target).value)" />

    <input
      pInputText
      placeholder="Description"
      [value]="articleSelectionne().description"
      (input)="mettreAJourChamp('description', $any($event.target).value)" />

    <p-inputNumber
      [ngModel]="articleSelectionne().prixUnitaire"
      (ngModelChange)="mettreAJourChamp('prixUnitaire', $event)"
      placeholder="Prix Unitaire"
      prefix="XAF " />

    <p-select
      [options]="typeEvenementOptions"
      [ngModel]="articleSelectionne().typeEvenement"
      (ngModelChange)="mettreAJourChamp('typeEvenement', $event)"
      placeholder="Type d'événement" />

  </div>

  <ng-template pTemplate="footer">
    <p-button label="Annuler" severity="secondary" (onClick)="dialogVisible.set(false)" />
    <p-button label="Sauvegarder" (onClick)="sauvegarder()" />
  </ng-template>

</p-dialog>
