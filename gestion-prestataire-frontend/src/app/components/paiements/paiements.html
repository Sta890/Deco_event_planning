<div style="margin-bottom: 1rem;">
  <p-button label="Enregistrer un paiement" icon="pi pi-plus" (onClick)="ouvrirDialog()" />
</div>

<p-table [value]="paiements()" [paginator]="true" [rows]="5">

  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Date</th>
      <th>Montant</th>
      <th>Mode de Paiement</th>
      <th>ID Facture</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-paiement>
    <tr>
      <td>{{ paiement.idPaiement }}</td>
      <td>{{ paiement.datePaiement | date:'dd/MM/yyyy' }}</td>
      <td>{{ paiement.montant | currency:'XAF':'symbol':'1.0-0' }}</td>
      <td>
        <p-tag [value]="paiement.modePaiement" [severity]="getCouleurMode(paiement.modePaiement)" />
      </td>
      <td>{{ paiement.idFacture }}</td>
      <td style="display: flex; gap: 0.5rem;">
        <p-button icon="pi pi-pencil" severity="info" (onClick)="modifierPaiement(paiement)" />
        <p-button icon="pi pi-trash" severity="danger" (onClick)="supprimerPaiement(paiement.idPaiement)" />
      </td>
    </tr>
  </ng-template>

</p-table>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  header="Paiement"
  [modal]="true"
  [style]="{ width: '450px' }">

  <div style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0;">

    <p-datepicker
      [ngModel]="paiementSelectionne().datePaiement"
      (ngModelChange)="mettreAJourChamp('datePaiement', $event)"
      dateFormat="dd/mm/yy"
      placeholder="Date du paiement" />

    <p-inputNumber
      [ngModel]="paiementSelectionne().montant"
      (ngModelChange)="mettreAJourChamp('montant', $event)"
      placeholder="Montant"
      prefix="XAF " />

    <p-select
      [options]="modePaiementOptions"
      [ngModel]="paiementSelectionne().modePaiement"
      (ngModelChange)="mettreAJourChamp('modePaiement', $event)"
      placeholder="Mode de paiement" />

    <p-inputNumber
      [ngModel]="paiementSelectionne().idFacture"
      (ngModelChange)="mettreAJourChamp('idFacture', $event)"
      placeholder="ID Facture" />

  </div>

  <ng-template pTemplate="footer">
    <p-button label="Annuler" severity="secondary" (onClick)="dialogVisible.set(false)" />
    <p-button label="Sauvegarder" (onClick)="sauvegarder()" />
  </ng-template>

</p-dialog>
