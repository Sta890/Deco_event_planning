<!-- Bouton Ajouter -->
<div style="margin-bottom: 1rem;">
  <p-button label="Ajouter un client" icon="pi pi-plus" (onClick)="ouvrirDialog()" />
</div>

<!-- Tableau -->
<p-table [value]="clients()" [paginator]="true" [rows]="5">

  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Nom</th>
      <th>Téléphone</th>
      <th>Adresse</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-client>
    <tr>
      <td>{{ client.id }}</td>
      <td>{{ client.nom }}</td>
      <td>{{ client.telephone }}</td>
      <td>{{ client.adresse }}</td>
      <td>{{ client.email }}</td>
      <td style="display: flex; gap: 0.5rem;">
        <p-button icon="pi pi-pencil" severity="info" (onClick)="modifierClient(client)" />
        <p-button icon="pi pi-trash" severity="danger" (onClick)="supprimerClient(client.id)" />
      </td>
    </tr>
  </ng-template>

</p-table>

<!-- Dialog Ajout / Modification -->
<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  header="Client"
  [modal]="true"
  [style]="{ width: '400px' }">

  <div style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0;">

    <input pInputText placeholder="Nom"
      [value]="clientSelectionne().nom"
      (input)="mettreAJourChamp('nom', $any($event.target).value)" />

    <input pInputText placeholder="Téléphone"
      [value]="clientSelectionne().telephone"
      (input)="mettreAJourChamp('telephone', $any($event.target).value)" />

    <input pInputText placeholder="Adresse"
      [value]="clientSelectionne().adresse"
      (input)="mettreAJourChamp('adresse', $any($event.target).value)" />

    <input pInputText placeholder="Email"
      [value]="clientSelectionne().email"
      (input)="mettreAJourChamp('email', $any($event.target).value)" />

  </div>

  <ng-template pTemplate="footer">
    <p-button label="Annuler" severity="secondary" (onClick)="dialogVisible.set(false)" />
    <p-button label="Sauvegarder" (onClick)="sauvegarder()" />
  </ng-template>

</p-dialog>
