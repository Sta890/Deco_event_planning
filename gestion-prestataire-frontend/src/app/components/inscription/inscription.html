<div class="inscription-wrapper">

  <div class="inscription-card">

    <!-- Logo -->
    <div class="login-logo">
      <i class="pi pi-sparkles"></i>
      <h1>DecoEvent</h1>
    </div>

    <p class="login-subtitle">Créez votre compte client</p>

    <!-- Étapes -->
    <div class="etapes">
      <div class="etape" [class.etape-active]="etape() >= 1" [class.etape-done]="etape() > 1">
        <div class="etape-cercle">
          @if (etape() > 1) { <i class="pi pi-check"></i> } @else { 1 }
        </div>
        <span>Informations</span>
      </div>
      <div class="etape-ligne" [class.etape-ligne-active]="etape() > 1"></div>
      <div class="etape" [class.etape-active]="etape() >= 2">
        <div class="etape-cercle">2</div>
        <span>Mot de passe</span>
      </div>
    </div>

    <!-- Erreur -->
    @if (erreur()) {
      <p-message severity="error" [text]="erreur()" />
    }

    <!-- Étape 1 -->
    @if (etape() === 1) {
      <div class="form">
        <div class="field">
          <label>Nom complet <span class="required">*</span></label>
          <input pInputText placeholder="Jean Dupont"
            [value]="formulaire().nom"
            (input)="mettreAJour('nom', $any($event.target).value)" />
        </div>
        <div class="field">
          <label>Téléphone <span class="required">*</span></label>
          <input pInputText placeholder="6XX XXX XXX"
            [value]="formulaire().telephone"
            (input)="mettreAJour('telephone', $any($event.target).value)" />
        </div>
        <div class="field">
          <label>Adresse</label>
          <input pInputText placeholder="Yaoundé, Douala..."
            [value]="formulaire().adresse"
            (input)="mettreAJour('adresse', $any($event.target).value)" />
        </div>
        <div class="field">
          <label>Email <span class="required">*</span></label>
          <input pInputText type="email" placeholder="votre@email.cm"
            [value]="formulaire().email"
            (input)="mettreAJour('email', $any($event.target).value)" />
        </div>
        <button class="btn-primary" (click)="etapeSuivante()">
          Suivant <i class="pi pi-arrow-right"></i>
        </button>
      </div>
    }

    <!-- Étape 2 -->
    @if (etape() === 2) {
      <div class="form">
        <div class="field">
          <label>Mot de passe <span class="required">*</span></label>
          <p-password
            [ngModel]="formulaire().motDePasse"
            (ngModelChange)="mettreAJour('motDePasse', $event)"
            placeholder="••••••••"
            [feedback]="true"
            [toggleMask]="true" />
        </div>
        <div class="field">
          <label>Confirmer le mot de passe <span class="required">*</span></label>
          <p-password
            [ngModel]="formulaire().confirmerMotDePasse"
            (ngModelChange)="mettreAJour('confirmerMotDePasse', $event)"
            placeholder="••••••••"
            [feedback]="false"
            [toggleMask]="true" />
        </div>
        <div class="form-actions">
          <button class="btn-secondary" (click)="etape.set(1)">
            <i class="pi pi-arrow-left"></i> Retour
          </button>
          <button class="btn-primary" (click)="sinscrire()">
            <i class="pi pi-check"></i> Créer mon compte
          </button>
        </div>
      </div>
    }

    <!-- Lien login -->
    <div class="login-link">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </div>

  </div>

</div>
