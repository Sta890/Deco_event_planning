<div class="dashboard">

  <!-- Titre -->
  <div class="dashboard-header">
    <h1 class="dashboard-title">Tableau de bord Admin</h1>
  </div>

  <!-- Cartes stats -->
  <div class="stats-grid">
    @for (stat of stats(); track stat.label) {
      <div class="stat-card">
        <div class="stat-icon" [style.background]="stat.couleur + '20'">
          <i [class]="stat.icon" [style.color]="stat.couleur"></i>
        </div>
        <div class="stat-info">
          <span class="stat-valeur">{{ stat.valeur }}</span>
          <span class="stat-label">{{ stat.label }}</span>
        </div>
      </div>
    }
  </div>

  <!-- Contenu bas -->
  <div class="dashboard-bottom">

    <div class="card">
      <h3 class="card-title">Indicateurs</h3>
      <div class="activites">
        <div class="activite-item">
          <div class="activite-icon" style="background: #22c55e20">
            <i class="pi pi-money-bill" style="color: #22c55e"></i>
          </div>
          <div class="activite-info">
            <span class="activite-action">Chiffre d'affaires</span>
            <span class="activite-detail">{{ data()?.chiffreAffaires | currency:'XAF':'symbol':'1.0-0' }}</span>
          </div>
        </div>

        <div class="activite-item">
          <div class="activite-icon" style="background: #6366f120">
            <i class="pi pi-chart-line" style="color: #6366f1"></i>
          </div>
          <div class="activite-info">
            <span class="activite-action">Taux de conversion des devis</span>
            <span class="activite-detail">{{ data()?.tauxConversion }} %</span>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
