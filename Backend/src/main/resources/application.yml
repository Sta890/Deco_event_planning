spring:
  profiles:
    # Profil par défaut en local. En déploiement, définir SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:local}

app:
  jwt:
    secret: ${JWT_SECRET:decoevent_secret_key_2026_very_long_and_secure}
    expiration: 86400000

server:
  port: ${PORT:8070}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
