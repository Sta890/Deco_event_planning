# Profil "prod" : déploiement.
# Toutes les valeurs sensibles proviennent de variables d'environnement (pas de
# secret ni de mot de passe en dur). À définir sur la plateforme d'hébergement :
#   SPRING_PROFILES_ACTIVE=prod
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET
#   CORS_ORIGIN   (ex: https://mon-frontend.example.com)
#   PORT          (souvent fourni par la plateforme)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Le schéma est vérifié au démarrage mais jamais modifié automatiquement.
      # ATTENTION : au tout premier déploiement la base est vide, donc
      # "validate" échoue. Définir DDL_AUTO=update pour ce premier démarrage
      # (la table est alors créée), puis remettre "validate" (valeur par défaut).
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ORIGIN}
  # Aucune donnée de démonstration en production.
  data-initializer:
    enabled: false

# Swagger désactivé par défaut en prod ; activable avec SWAGGER_ENABLED=true.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: info
    com.onana.decoevent: info
