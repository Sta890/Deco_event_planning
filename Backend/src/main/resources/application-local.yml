# Profil "local" : développement sur la machine, base MySQL locale.
# Valeurs par défaut pratiques pour le dev, surchargeables par variables d'environnement.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/decoevent?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:4200}
